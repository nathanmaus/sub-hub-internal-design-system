<!-- @dsCard group="Spacing" viewport="700x170" name="Layout & control heights" subtitle="1240 max · 44px default control · 244 sidebar" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-mono-label);text-transform:uppercase;color:var(--text-subtle)}.ramp{display:flex;border-radius:var(--radius-sm);overflow:hidden;height:54px}.ramp div{flex:1}.hex{display:flex;justify-content:space-between;margin-top:7px;font:var(--type-mono);font-size:10px;color:var(--text-subtle)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}table{width:100%;border-collapse:collapse}td{padding:5px 0;font:var(--type-body);font-size:14px;color:var(--text-body)}td.v{font:var(--type-mono);font-size:12.5px;color:var(--text-strong);text-align:right}</style>
</head><body>
<div class="row" style="gap:10px;align-items:flex-end;margin-bottom:14px">
<div style="height:34px;padding:0 14px;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--sand-400);color:#fff;font:var(--weight-semibold) 13.5px/1 var(--font-sans)">34 sm</div>
<div style="height:44px;padding:0 20px;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--sand-400);color:#fff;font:var(--weight-semibold) 15px/1 var(--font-sans)">44 default</div>
<div style="height:52px;padding:0 26px;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--sand-400);color:#fff;font:var(--weight-semibold) 16.5px/1 var(--font-sans)">52 hero</div></div>
<table><tbody>
<tr><td>--container-max / narrow</td><td class="v">1240 / 760</td></tr>
<tr><td>--gutter · --card-pad</td><td class="v">24 · 24</td></tr>
<tr><td>--section-y</td><td class="v">112</td></tr>
<tr><td>--app-sidebar-w · --app-topbar-h</td><td class="v">244 · 60</td></tr>
</tbody></table>
</body></html>
