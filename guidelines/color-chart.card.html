<!-- @dsCard group="Colors" viewport="700x200" name="Chart colours" subtitle="Categorical chart-1 to 3 then Other · ordinal ramp chart-seq-1 to 4 for funnels" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css">
<style>
  body{margin:0;background:var(--surface-card);padding:20px;font-family:var(--font-sans,system-ui,sans-serif);color:var(--text-body)}
  .lbl{font-weight:600;font-size:12px;line-height:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle);margin:0 0 8px}
  .row{display:flex;gap:8px;margin-bottom:20px}
  .sw{flex:1;display:grid;gap:4px}
  .chip{height:40px;border-radius:8px}
  .name{font-size:12px;line-height:16px;color:var(--text-muted)}
</style>
</head><body>
<p class="lbl">Categorical · fixed order, never cycled</p>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--chart-1)"></div><span class="name">chart-1</span></div>
  <div class="sw"><div class="chip" style="background:var(--chart-2)"></div><span class="name">chart-2</span></div>
  <div class="sw"><div class="chip" style="background:var(--chart-3)"></div><span class="name">chart-3</span></div>
  <div class="sw"><div class="chip" style="background:var(--chart-other)"></div><span class="name">chart-other</span></div>
</div>
<p class="lbl">Ordinal · funnel stages, most contrast first</p>
<div class="row" style="margin:0">
  <div class="sw"><div class="chip" style="background:var(--chart-seq-1)"></div><span class="name">chart-seq-1</span></div>
  <div class="sw"><div class="chip" style="background:var(--chart-seq-2)"></div><span class="name">chart-seq-2</span></div>
  <div class="sw"><div class="chip" style="background:var(--chart-seq-3)"></div><span class="name">chart-seq-3</span></div>
  <div class="sw"><div class="chip" style="background:var(--chart-seq-4)"></div><span class="name">chart-seq-4</span></div>
</div>
</body></html>
