<!-- @dsCard group="Spacing" viewport="700x160" name="Interaction states" subtitle="Hover = one step darker · focus = 3px blue-200 ring · press = scale .985" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-mono-label);text-transform:uppercase;color:var(--text-subtle)}.ramp{display:flex;border-radius:var(--radius-sm);overflow:hidden;height:54px}.ramp div{flex:1}.hex{display:flex;justify-content:space-between;margin-top:7px;font:var(--type-mono);font-size:10px;color:var(--text-subtle)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.b{height:44px;padding:0 20px;display:inline-grid;place-items:center;border-radius:var(--radius-control);font:var(--weight-semibold) 15px/1 var(--font-sans);border:1px solid transparent}</style>
</head><body>
<div class="row" style="gap:12px">
<span class="b" style="background:var(--sand-400);color:#fff;box-shadow:var(--shadow-xs)">Rest</span>
<span class="b" style="background:var(--sand-700);color:#fff;box-shadow:var(--shadow-xs)">Hover</span>
<span class="b" style="background:var(--sand-800);color:#fff;transform:scale(.985)">Press</span>
<span class="b" style="background:var(--sand-400);color:#fff;box-shadow:var(--ring-focus)">Focus</span>
<span class="b" style="background:var(--action-disabled-bg);color:var(--action-disabled-text)">Disabled</span>
</div>
<div class="row" style="gap:20px;margin-top:20px">
<span style="font:var(--type-body);color:var(--text-link)">Link at rest</span>
<span style="font:var(--type-body);color:var(--text-link-hover)">Link on hover → amber</span>
<span class="lbl">never an opacity fade</span></div>
</body></html>
