<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-mono-label);text-transform:uppercase;color:var(--text-subtle)}.ramp{display:flex;border-radius:var(--radius-sm);overflow:hidden;height:54px}.ramp div{flex:1}.hex{display:flex;justify-content:space-between;margin-top:7px;font:var(--type-mono);font-size:10px;color:var(--text-subtle)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style>
</head><body>
<div style="display:flex;align-items:flex-end;gap:8px">

.5px;color:var(--text-subtle)">48</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:29.09090909090909px;height:64px;background:var(--sand-300)"></div><span style="font:var(--type-mono);font-size:9.5px;color:var(--text-subtle)">64</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:36.36363636363636px;height:64px;background:var(--sand-400)"></div><span style="font:var(--type-mono);font-size:9.5px;color:var(--text-subtle)">80</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:50.90909090909091px;height:64px;background:var(--sand-300)"></div><span style="font:var(--type-mono);font-size:9.5px;color:var(--text-subtle)">112</span></div>
</div><div class="lbl" style="margin-top:12px">--space-1 … --space-12</div>
</body></html>
