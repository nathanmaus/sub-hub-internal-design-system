<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces & text" subtitle="Page is ink-100, cards are white, one dark panel per page" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-mono-label);text-transform:uppercase;color:var(--text-subtle)}.ramp{display:flex;border-radius:var(--radius-sm);overflow:hidden;height:54px}.ramp div{flex:1}.hex{display:flex;justify-content:space-between;margin-top:7px;font:var(--type-mono);font-size:10px;color:var(--text-subtle)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.s{flex:1;height:104px;border-radius:var(--radius-card);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between}</style>
</head><body>
<div class="row" style="flex-wrap:nowrap;gap:12px">
<div class="s" style="background:var(--surface-page);border:1px solid var(--border-subtle)"><span style="color:var(--text-strong);font:var(--type-label)">Page</span><span class="lbl">--surface-page</span></div>
<div class="s" style="background:var(--surface-card);border:1px solid var(--border-subtle);box-shadow:var(--shadow-sm)"><span style="color:var(--text-strong);font:var(--type-label)">Card</span><span class="lbl">--surface-card</span></div>
<div class="s" style="background:var(--surface-sunken);border:1px solid var(--border-subtle)"><span style="color:var(--text-strong);font:var(--type-label)">Sunken</span><span class="lbl">--surface-sunken</span></div>
<div class="s" style="background:var(--surface-brand-subtle);border:1px solid var(--sand-200)"><span style="color:var(--sand-800);font:var(--type-label)">Brand</span><span class="lbl" style="color:var(--sand-700)">--surface-brand-subtle</span></div>
<div class="s" style="background:var(--surface-inverse);border:1px solid var(--border-inverse)"><span style="color:var(--white);font:var(--type-label)">Inverse</span><span class="lbl" style="color:var(--teal-500)">--surface-inverse</span></div>
</div>
</body></html>
