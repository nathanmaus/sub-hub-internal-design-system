<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-mono-label);text-transform:uppercase;color:var(--text-subtle)}.ramp{display:flex;border-radius:var(--radius-sm);overflow:hidden;height:54px}.ramp div{flex:1}.hex{display:flex;justify-content:space-between;margin-top:7px;font:var(--type-mono);font-size:10px;color:var(--text-subtle)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.e{flex:1;height:86px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);display:grid;place-items:center;font:var(--type-mono);font-size:11px;color:var(--text-muted)}</style>
</head><body>
<div class="row" style="flex-wrap:nowrap;gap:18px;padding:6px 4px 10px">
<div class="e" style="box-shadow:var(--shadow-xs)">xs</div>
<div class="e" style="box-shadow:var(--shadow-sm)">sm · default</div>
<div class="e" style="box-shadow:var(--shadow-md)">md · hover</div>
<div class="e" style="box-shadow:var(--shadow-lg)">lg</div>
<div class="e" style="box-shadow:var(--shadow-overlay)">overlay</div></div>
</body></html>
