<!-- @dsCard group="Brand" viewport="700x180" name="Motif · Skew slabs" subtitle="-16° bars in the chart sequence, on ruled paper" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-mono-label);text-transform:uppercase;color:var(--text-subtle)}.ramp{display:flex;border-radius:var(--radius-sm);overflow:hidden;height:54px}.ramp div{flex:1}.hex{display:flex;justify-content:space-between;margin-top:7px;font:var(--type-mono);font-size:10px;color:var(--text-subtle)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}body{padding:0}.m{position:relative;height:180px;overflow:hidden;background:var(--teal-025);border-bottom:1px solid var(--border-subtle)}</style>
</head><body>
<div class="m">
<div style="position:absolute;inset:0;background-image:linear-gradient(rgba(44,47,62,.055) 1px,transparent 1px);background-size:100% 26px"></div>
<div style="position:absolute;right:40px;bottom:0;display:flex;align-items:flex-end;gap:10px;height:180px">
<div style="width:34px;height:58px;background:var(--chart-5);transform:skewX(-16deg)"></div>
<div style="width:34px;height:90px;background:var(--chart-3);transform:skewX(-16deg)"></div>
<div style="width:34px;height:132px;background:var(--chart-1);transform:skewX(-16deg)"></div>
<div style="width:34px;height:164px;background:var(--chart-2);transform:skewX(-16deg)"></div>
<div style="width:34px;height:106px;background:var(--chart-4);transform:skewX(-16deg)"></div>
</div></div>
</body></html>
