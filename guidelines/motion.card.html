<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-mono-label);text-transform:uppercase;color:var(--text-subtle)}.ramp{display:flex;border-radius:var(--radius-sm);overflow:hidden;height:54px}.ramp div{flex:1}.hex{display:flex;justify-content:space-between;margin-top:7px;font:var(--type-mono);font-size:10px;color:var(--text-subtle)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}@keyframes slide{0%,12%{transform:translateX(0)}50%,62%{transform:translateX(120px)}100%{transform:translateX(0)}}table{width:100%;border-collapse:collapse}td{padding:4px 0;font:var(--type-body);font-size:13.5px;color:var(--text-body)}td.v{font:var(--type-mono);font-size:12px;color:var(--text-strong);text-align:right}</style>

</tbody></table>
</body></html>
