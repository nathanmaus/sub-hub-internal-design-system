<!-- @dsCard group="Brand" viewport="700x180" name="Motif · Blueprint grid" subtitle="ink-950 + 50/250px rules + blue and amber glow" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-mono-label);text-transform:uppercase;color:var(--text-subtle)}.ramp{display:flex;border-radius:var(--radius-sm);overflow:hidden;height:54px}.ramp div{flex:1}.hex{display:flex;justify-content:space-between;margin-top:7px;font:var(--type-mono);font-size:10px;color:var(--text-subtle)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}body{padding:0}.m{position:relative;height:180px;overflow:hidden;background:var(--teal-950)}</style>
</head><body>
<div class="m">
<div style="position:absolute;inset:0;background-image:linear-gradient(var(--blueprint-rule-fine) 1px,transparent 1px),linear-gradient(90deg,var(--blueprint-rule-fine) 1px,transparent 1px);background-size:34px 34px"></div>
<div style="position:absolute;inset:0;background-image:linear-gradient(var(--blueprint-rule-major) 1px,transparent 1px),linear-gradient(90deg,var(--blueprint-rule-major) 1px,transparent 1px);background-size:170px 170px"></div>
<div style="position:absolute;inset:0;background:radial-gradient(320px 200px at 62% 45%,var(--blueprint-glow-blue),transparent 70%)"></div>
<div style="position:absolute;inset:0;background:radial-gradient(220px 150px at 98% 98%,var(--blueprint-glow-amber),transparent 70%)"></div>
</div>
</body></html>
