<!-- @dsCard group="Colors" viewport="700x140" name="Status" subtitle="Derived from the brand hues; warning reuses amber" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-mono-label);text-transform:uppercase;color:var(--text-subtle)}.ramp{display:flex;border-radius:var(--radius-sm);overflow:hidden;height:54px}.ramp div{flex:1}.hex{display:flex;justify-content:space-between;margin-top:7px;font:var(--type-mono);font-size:10px;color:var(--text-subtle)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:7px;font:var(--type-label);padding:6px 12px;border-radius:var(--radius-pill)}.dot{width:7px;height:7px;border-radius:50%}</style>
</head><body>
<div class="row">
<span class="pill" style="background:var(--status-success-bg);color:var(--status-success-text)"><span class="dot" style="background:var(--green-600)"></span>Approved</span>
<span class="pill" style="background:var(--status-warning-bg);color:var(--status-warning-text)"><span class="dot" style="background:var(--yellow-600)"></span>Awaiting permit</span>
<span class="pill" style="background:var(--status-danger-bg);color:var(--status-danger-text)"><span class="dot" style="background:var(--red-600)"></span>Overdue</span>
<span class="pill" style="background:var(--status-info-bg);color:var(--status-info-text)"><span class="dot" style="background:var(--sand-400)"></span>In review</span>
<span class="pill" style="background:var(--status-neutral-bg);color:var(--status-neutral-text)"><span class="dot" style="background:var(--teal-400)"></span>Draft</span>
</div>
<div class="lbl" style="margin-top:18px">success 07784F / DDF5EA &nbsp; warning A8760A / FFF6E0 &nbsp; danger A81C1C / FCE4E4 &nbsp; info 0031CC / E7ECFB</div>
</body></html>
