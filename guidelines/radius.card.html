<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="10 control · 14 card · 20 panel · 999 pill" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-mono-label);text-transform:uppercase;color:var(--text-subtle)}.ramp{display:flex;border-radius:var(--radius-sm);overflow:hidden;height:54px}.ramp div{flex:1}.hex{display:flex;justify-content:space-between;margin-top:7px;font:var(--type-mono);font-size:10px;color:var(--text-subtle)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style>
</head><body>
<div class="row" style="gap:14px">
<div style="display:grid;gap:8px;justify-items:center"><div style="width:78px;height:56px;background:var(--teal-100);border:1px solid var(--border-default);border-radius:4px"></div><span style="font:var(--type-mono);font-size:10px;color:var(--text-subtle)">xs · 4px</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:78px;height:56px;background:var(--teal-100);border:1px solid var(--border-default);border-radius:6px"></div><span style="font:var(--type-mono);font-size:10px;color:var(--text-subtle)">sm · 6px</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:78px;height:56px;background:var(--teal-100);border:1px solid var(--border-default);border-radius:10px"></div><span style="font:var(--type-mono);font-size:10px;color:var(--text-subtle)">md · 10px</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:78px;height:56px;background:var(--teal-100);border:1px solid var(--border-default);border-radius:14px"></div><span style="font:var(--type-mono);font-size:10px;color:var(--text-subtle)">lg · 14px</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:78px;height:56px;background:var(--teal-100);border:1px solid var(--border-default);border-radius:20px"></div><span style="font:var(--type-mono);font-size:10px;color:var(--text-subtle)">xl · 20px</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:78px;height:56px;background:var(--teal-100);border:1px solid var(--border-default);border-radius:28px"></div><span style="font:var(--type-mono);font-size:10px;color:var(--text-subtle)">2xl · 28px</span></div>
<div style="display:grid;gap:8px;justify-items:center"><div style="width:78px;height:56px;background:var(--teal-100);border:1px solid var(--border-default);border-radius:999px"></div><span style="font:var(--type-mono);font-size:10px;color:var(--text-subtle)">pill · 999</span></div>
</div>
</body></html>
