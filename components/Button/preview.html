<!doctype html>
<meta charset="utf-8">
<style>
  :root{
    --weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;
    --tracking-eyebrow:.16em;--tracking-body:-.005em;--tracking-heading:-.02em;--tracking-hero:-.05em;
    --duration-instant:90ms;--duration-fast:150ms;--duration-base:220ms;
    --ease-standard:cubic-bezier(.2,0,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
    --press-scale:.985;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--surface-page,#EAEDEE);
    font:400 16px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:-.005em;
    color:var(--text-body,#5B6769);-webkit-font-smoothing:antialiased}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .col{display:flex;flex-direction:column;gap:12px}
  .cap{font:500 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-subtle,#8F9B9C)}
  .tabular{font-variant-numeric:tabular-nums}
  svg{display:block}
</style>
<style>
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    height:var(--control-height,44px);padding:0 20px;
    font:600 15px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.002em;
    white-space:nowrap;border-radius:var(--radius-control,10px);border:1px solid transparent;
    box-shadow:var(--shadow-xs,0 1px 2px rgba(14,21,32,.06));cursor:pointer;
    transition:background-color var(--duration-fast) var(--ease-standard),
      color var(--duration-fast) var(--ease-standard),
      border-color var(--duration-fast) var(--ease-standard),
      box-shadow var(--duration-fast) var(--ease-standard)}
  .btn:active{transform:scale(var(--press-scale))}
  .btn-sm{height:var(--control-height-sm,34px);padding:0 14px;font-size:13.5px;gap:8px}
  .btn-lg{height:var(--control-height-lg,52px);padding:0 26px;font-size:16.5px;gap:12px}
  .primary{background:var(--action-primary,#39B8C6);color:var(--text-on-brand,#fff)}
  .primary:hover{background:var(--action-primary-hover,#2E939E)}
  .secondary{background:var(--surface-card,#fff);color:var(--text-strong,#30393A);
    border-color:var(--border-default,#C6CECE)}
  .secondary:hover{background:var(--teal-025,#F8F9F9)}
  .dark{background:var(--action-secondary,#30393A);color:var(--text-on-ink,#fff)}
  .dark:hover{background:var(--action-secondary-hover,#404A4B)}
  .accent{background:var(--action-accent,#D9B98A);color:var(--teal-900,#30393A)}
  .accent:hover{background:var(--action-accent-hover,#C29C66)}
  .ghost{background:transparent;color:var(--text-link,#39B8C6);box-shadow:none}
  .ghost:hover{background:var(--sand-100,#ECF5F6)}
  .is-disabled{background:var(--action-disabled-bg,#DBE1E2);color:var(--action-disabled-text,#8F9B9C);
    border-color:transparent;box-shadow:none;cursor:not-allowed}
</style>
<div class="col" style="gap:16px">
  <div class="row">
    <button class="btn primary">Create quote</button>
    <button class="btn secondary">Save draft</button>
    <button class="btn dark">Open job</button>
    <button class="btn accent">Ask AI</button>
    <button class="btn ghost">Cancel</button>
    <button class="btn is-disabled" disabled>Unavailable</button>
  </div>
  <div class="row">
    <button class="btn primary btn-sm"><span aria-hidden="true" style="display:inline-block;flex:0 0 auto;width:15px;height:15px;background:currentColor;-webkit-mask:url(../../icons/plus.svg) center/contain no-repeat;mask:url(../../icons/plus.svg) center/contain no-repeat"></span> Add line</button>
    <button class="btn primary"><span aria-hidden="true" style="display:inline-block;flex:0 0 auto;width:17px;height:17px;background:currentColor;-webkit-mask:url(../../icons/plus.svg) center/contain no-repeat;mask:url(../../icons/plus.svg) center/contain no-repeat"></span> Add line</button>
    <button class="btn primary btn-lg">Continue <span aria-hidden="true" style="display:inline-block;flex:0 0 auto;width:19px;height:19px;background:currentColor;-webkit-mask:url(../../icons/arrow-right.svg) center/contain no-repeat;mask:url(../../icons/arrow-right.svg) center/contain no-repeat"></span></button>
  </div>
</div>
