<!doctype html>
<meta charset="utf-8">
<style>
  :root{
    --weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;
    --tracking-eyebrow:.16em;--tracking-body:-.005em;--tracking-heading:-.02em;--tracking-hero:-.05em;
    --duration-instant:90ms;--duration-fast:150ms;--duration-base:220ms;
    --ease-standard:cubic-bezier(.2,0,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
    --press-scale:.985;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--surface-page,#EAEDEE);
    font:400 16px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:-.005em;
    color:var(--text-body,#5B6769);-webkit-font-smoothing:antialiased}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .col{display:flex;flex-direction:column;gap:12px}
  .cap{font:500 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-subtle,#8F9B9C)}
  .tabular{font-variant-numeric:tabular-nums}
  svg{display:block}
</style>
<style>
  .lbl{font:600 14px/1.3 var(--font-sans,"Inter",system-ui,sans-serif);color:var(--text-strong,#30393A)}
  .req{color:var(--red-600,#53AAB4);margin-left:4px}
  .hint{font:400 13px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);color:var(--text-muted,#707A7B)}
  .err{font:400 13px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);color:var(--status-danger-text,#3B8188)}
  .field{display:grid;gap:8px;max-width:360px}
  .control{display:flex;align-items:center;gap:8px;height:var(--field-height,44px);padding:0 12px;
    background:var(--surface-card,#fff);border:1px solid var(--border-default,#C6CECE);
    border-radius:var(--radius-control,10px);
    transition:border-color var(--duration-fast) var(--ease-standard),
      box-shadow var(--duration-fast) var(--ease-standard)}
  .control input,.control select{flex:1;min-width:0;border:none;outline:none;background:transparent;
    font:400 15px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);color:var(--text-strong,#30393A)}
  .control select{appearance:none;cursor:pointer}
  .is-focus{border-color:var(--border-brand,#39B8C6);box-shadow:var(--ring-focus,0 0 0 3px #D0DFE1)}
  .is-invalid{border-color:var(--red-600,#53AAB4)}
  .is-off{background:var(--teal-100,#EAEDEE)}
  .affix{font:500 13px/1.4 var(--font-sans,"Inter",system-ui,sans-serif);color:var(--text-subtle,#8F9B9C)}
</style>

<div class="col" style="gap:12px;max-width:360px">
  <div class="control"><input value="" placeholder="Search projects" readonly></div>
  <div class="control"><span aria-hidden="true" style="display:inline-block;flex:0 0 auto;width:17px;height:17px;background:var(--text-subtle,#8F9B9C);-webkit-mask:url(../../icons/search.svg) center/contain no-repeat;mask:url(../../icons/search.svg) center/contain no-repeat"></span><input value="Maple Street" readonly></div>
  <div class="control is-focus"><span aria-hidden="true" style="display:inline-block;flex:0 0 auto;width:17px;height:17px;background:var(--text-subtle,#8F9B9C);-webkit-mask:url(../../icons/search.svg) center/contain no-repeat;mask:url(../../icons/search.svg) center/contain no-repeat"></span><input value="Maple St" readonly><span class="affix">24</span></div>
  <div class="control"><input value="18500.00" readonly><span class="affix">USD</span></div>
  <div class="control is-invalid"><input value="not-an-email" readonly></div>
  <div class="control is-off"><input value="Locked after approval" readonly disabled></div>
</div>
