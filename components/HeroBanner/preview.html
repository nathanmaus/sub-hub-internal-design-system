<!doctype html>
<meta charset="utf-8">
<style>
  :root{
    --weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;
    --tracking-eyebrow:.16em;--tracking-body:-.005em;--tracking-heading:-.02em;--tracking-hero:-.05em;
    --duration-instant:90ms;--duration-fast:150ms;--duration-base:220ms;
    --ease-standard:cubic-bezier(.2,0,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
    --press-scale:.985;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--surface-page,#EAEDEE);
    font:400 16px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:-.005em;
    color:var(--text-body,#5B6769);-webkit-font-smoothing:antialiased}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .col{display:flex;flex-direction:column;gap:12px}
  .cap{font:500 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-subtle,#8F9B9C)}
  .tabular{font-variant-numeric:tabular-nums}
  svg{display:block}
</style>
<style>
  .hb{position:relative;overflow:hidden;border-radius:var(--radius-card,14px);
    box-shadow:var(--shadow-lg,0 4px 8px rgba(14,21,32,.05),0 18px 40px rgba(14,21,32,.1));
    font-family:var(--font-display,"Poppins",system-ui,sans-serif)}
  .bp{background:var(--surface-inverse,#1B2122);padding:32px 28px 24px;min-height:232px;
    display:flex;flex-direction:column;justify-content:center;gap:16px}
  .layer{position:absolute;inset:0;pointer-events:none}
  .g1{background-image:linear-gradient(var(--blueprint-rule-fine,rgba(255,255,255,.045)) 1px,transparent 1px),
    linear-gradient(90deg,var(--blueprint-rule-fine,rgba(255,255,255,.045)) 1px,transparent 1px);
    background-size:24px 24px}
  .g2{background-image:linear-gradient(var(--blueprint-rule-major,rgba(85,116,111,.16)) 1px,transparent 1px),
    linear-gradient(90deg,var(--blueprint-rule-major,rgba(85,116,111,.16)) 1px,transparent 1px);
    background-size:120px 120px}
  .g3{background:radial-gradient(420px 240px at 72% 46%,var(--blueprint-glow-blue,rgba(85,116,111,.3)),transparent 70%)}
  .g4{background:radial-gradient(280px 180px at 96% 96%,var(--blueprint-glow-amber,rgba(217,185,138,.14)),transparent 70%)}
  .hb-in{position:relative;display:flex;flex-direction:column;gap:16px}
  .eyebrow{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;
    border:1px solid rgba(217,185,138,.45);border-radius:999px;background:rgba(217,185,138,.08);
    font:500 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.16em;
    text-transform:uppercase;color:var(--sand-400,#D9B98A);white-space:nowrap}
  .hb h1{margin:0;font:700 44px/0.9 var(--font-display,"Poppins",system-ui,sans-serif);
    letter-spacing:-.05em;color:var(--white,#fff);text-wrap:balance}
  .sub{display:flex;align-items:center;gap:12px}
  .rule{width:48px;height:4px;background:var(--sand-400,#D9B98A);flex:0 0 auto}
  .sub p{margin:0;font:500 14px/1.5 var(--font-sans,"Inter",system-ui,sans-serif);color:var(--teal-400,#ADB9BA)}
  .rail{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;
    flex-wrap:wrap;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);margin-top:8px}
  .rail img{height:20px;width:auto;display:block}
  .rail span{font:500 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.14em;
    text-transform:uppercase;color:var(--teal-500,#8F9B9C)}
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px}
  .ed{position:relative;overflow:hidden;background:var(--teal-025,#F8F9F9);padding:24px 20px 24px 36px;
    min-height:120px;border-radius:var(--radius-card,14px);display:flex;flex-direction:column;
    justify-content:center;gap:8px}
  .ed .bar{position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--sand-400,#39B8C6)}
  .ed .bar2{position:absolute;left:8px;top:0;bottom:0;width:8px;background:var(--sand-400,#D9B98A)}
  .ed h2{margin:0;font:700 28px/0.92 var(--font-display,"Poppins",system-ui,sans-serif);
    letter-spacing:-.04em;color:var(--teal-900,#30393A)}
  .am{position:relative;overflow:hidden;background:var(--sand-400,#D9B98A);padding:24px 20px;
    min-height:120px;border-radius:var(--radius-card,14px);display:flex;flex-direction:column;
    justify-content:center;gap:8px}
  .am .skew{position:absolute;right:-24px;top:0;bottom:0;width:44%;background:var(--teal-900,#30393A);
    transform:skewX(-16deg)}
  .am h2{position:relative;margin:0;font:700 28px/0.92 var(--font-display,"Poppins",system-ui,sans-serif);
    letter-spacing:-.04em;color:var(--teal-900,#30393A)}
  .cap2{font:500 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.16em;
    text-transform:uppercase}
</style>
<div class="hb bp">
  <div class="layer g1"></div><div class="layer g2"></div>
  <div class="layer g3"></div><div class="layer g4"></div>
  <div class="hb-in">
    <span class="eyebrow"><span aria-hidden="true" style="display:inline-block;flex:0 0 auto;width:13px;height:13px;background:currentColor;-webkit-mask:url(../../icons/lightning-bolt.svg) center/contain no-repeat;mask:url(../../icons/lightning-bolt.svg) center/contain no-repeat"></span> Blueprint</span>
    <h1>Engineering</h1>
    <div class="sub"><span class="rule"></span><p>Quote, sell and build every job from one system.</p></div>
    <div class="rail">
      <img src="../../assets/logo-light.png" alt="SubcontractorHub">
      <span>Quote &nbsp;·&nbsp; Sell &nbsp;·&nbsp; Build &nbsp;·&nbsp; Pay</span>
    </div>
  </div>
</div>
<div class="strip">
  <div class="ed"><span class="bar"></span><span class="bar2"></span>
    <span class="cap2" style="color:var(--sand-400,#39B8C6)">Editorial</span>
    <h2>Pipeline</h2></div>
  <div class="am"><span class="skew"></span>
    <span class="cap2" style="color:var(--teal-900,#30393A);position:relative">Amber</span>
    <h2>EasyQuote</h2></div>
</div>
