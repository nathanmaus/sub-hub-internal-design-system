<!doctype html>
<meta charset="utf-8">
<style>
  :root{
    --weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;
    --tracking-eyebrow:.16em;--tracking-body:-.005em;--tracking-heading:-.02em;--tracking-hero:-.05em;
    --duration-instant:90ms;--duration-fast:150ms;--duration-base:220ms;
    --ease-standard:cubic-bezier(.2,0,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
    --press-scale:.985;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--surface-page,#EAEDEE);
    font:400 16px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:-.005em;
    color:var(--text-body,#5B6769);-webkit-font-smoothing:antialiased}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .col{display:flex;flex-direction:column;gap:12px}
  .cap{font:500 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-subtle,#8F9B9C)}
  .tabular{font-variant-numeric:tabular-nums}
  svg{display:block}
</style>
<style>
  .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;
    border-radius:var(--radius-pill,999px);white-space:nowrap;
    font:600 14px/1.3 var(--font-sans,"Inter",system-ui,sans-serif)}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
</style>
<div class="row" style="gap:12px">
  <span class="pill" style="background:var(--status-success-bg,#E2EEF0);color:var(--status-success-text,#20585F)">
    <span class="dot" style="background:var(--green-600,#2F767E)"></span>Approved</span>
  <span class="pill" style="background:var(--status-success-bg,#E2EEF0);color:var(--status-success-text,#20585F)">
    <span class="dot" style="background:var(--green-600,#2F767E)"></span>Paid</span>
  <span class="pill" style="background:var(--status-warning-bg,#F8F1E6);color:var(--status-warning-text,#7A5C30)">
    <span class="dot" style="background:var(--yellow-600,#C29C66)"></span>Pending</span>
  <span class="pill" style="background:var(--status-danger-bg,#E9F5F7);color:var(--status-danger-text,#3B8188)">
    <span class="dot" style="background:var(--red-600,#53AAB4)"></span>Overdue</span>
  <span class="pill" style="background:var(--status-info-bg,#ECF5F6);color:var(--status-info-text,#2E939E)">
    <span class="dot" style="background:var(--sand-400,#39B8C6)"></span>In review</span>
  <span class="pill" style="background:var(--status-neutral-bg,#EAEDEE);color:var(--status-neutral-text,#5B6769)">
    <span class="dot" style="background:var(--teal-400,#ADB9BA)"></span>Draft</span>
</div>
