<!doctype html>
<meta charset="utf-8">
<style>
  :root{
    --weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;
    --tracking-eyebrow:.16em;--tracking-body:-.005em;--tracking-heading:-.02em;--tracking-hero:-.05em;
    --duration-instant:90ms;--duration-fast:150ms;--duration-base:220ms;
    --ease-standard:cubic-bezier(.2,0,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
    --press-scale:.985;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--surface-page,#EAEDEE);
    font:400 16px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:-.005em;
    color:var(--text-body,#5B6769);-webkit-font-smoothing:antialiased}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .col{display:flex;flex-direction:column;gap:12px}
  .cap{font:500 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-subtle,#8F9B9C)}
  .tabular{font-variant-numeric:tabular-nums}
  svg{display:block}
</style>
<style>
  .lock{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .plate{display:flex;align-items:center;padding:24px;border-radius:var(--radius-card,14px);
    min-height:88px}
  .plate img{height:28px;width:auto;display:block}
  .note{font:400 13px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);color:var(--text-muted,#707A7B)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
</style>
<div class="grid">
  <div class="lock">
    <div class="plate" style="background:var(--surface-card,#fff);border:1px solid var(--border-subtle,#DBE1E2)">
      <img src="../../assets/logo-dark.svg" alt="SubHub"></div>
    <span class="note"><code>dark</code> — on white and teal-050</span>
  </div>
  <div class="lock">
    <div class="plate" style="background:var(--teal-900,#0F3438)">
      <img src="../../assets/logo-light.svg" alt="SubHub"></div>
    <span class="note"><code>light</code> — on teal-800, teal-900 and teal-950</span>
  </div>
  <div class="lock">
    <div class="plate" style="background:var(--sand-400,#D9B98A)">
      <img src="../../assets/logo-on-amber.svg" alt="SubHub"></div>
    <span class="note"><code>sand</code> — on sand-400 only</span>
  </div>
</div>
