<!-- @dsCard group="Overlays" height=280 subtitle="Announcement variant · tooltip spring 380 / 19 / 1" -->
<!doctype html>
<meta charset="utf-8">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;padding:32px 16px 16px;background:var(--surface-page,#EAEDEE);font:400 16px/1.45 var(--font-sans,"Inter",system-ui,sans-serif)}
</style>
<div id="root"></div>
<script>
  (function () {
    var ns = window.InternalDesignSystem;
    ReactDOM.createRoot(document.getElementById("root")).render(
      React.createElement(ns.Tooltip, {
        variant: "announcement",
        title: "Try out our new look!",
        body: "Same functionality with a refreshed interface. Switch back any time.",
        primaryLabel: "Let’s try it",
        secondaryLabel: "Not now",
        arrowAlign: "start",
        arrowOffset: 48,
        delay: 300,
        loop: true
      })
    );
  })();
</script>
