<!doctype html>
<meta charset="utf-8">
<style>
  :root{
    --weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;
    --tracking-eyebrow:.16em;--tracking-body:-.005em;--tracking-heading:-.02em;--tracking-hero:-.05em;
    --duration-instant:90ms;--duration-fast:150ms;--duration-base:220ms;
    --ease-standard:cubic-bezier(.2,0,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
    --press-scale:.985;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--surface-page,#EAEDEE);
    font:400 16px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:-.005em;
    color:var(--text-body,#5B6769);-webkit-font-smoothing:antialiased}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .col{display:flex;flex-direction:column;gap:12px}
  .cap{font:500 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-subtle,#8F9B9C)}
  .tabular{font-variant-numeric:tabular-nums}
  svg{display:block}
</style>
<style>
  .wrap{overflow:hidden;border:1px solid var(--border-subtle,#DBE1E2);
    border-radius:var(--radius-card,14px);background:var(--surface-card,#fff);
    box-shadow:var(--shadow-sm,0 1px 2px rgba(14,21,32,.06),0 1px 3px rgba(14,21,32,.05))}
  table{width:100%;border-collapse:collapse}
  thead tr{background:var(--teal-025,#F8F9F9)}
  th{text-align:left;padding:12px 20px;font:600 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);
    letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle,#8F9B9C);
    border-bottom:1px solid var(--border-subtle,#DBE1E2);white-space:nowrap}
  td{padding:16px 20px;font:400 15px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);
    color:var(--text-body,#5B6769);vertical-align:middle;border-bottom:1px solid var(--border-subtle,#DBE1E2)}
  tbody tr:last-child td{border-bottom:none}
  .strong{color:var(--text-strong,#30393A);font-weight:600}
  .num{font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;
    font:600 14px/1.3 var(--font-sans,"Inter",system-ui,sans-serif);white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%}
</style>
<div class="wrap">
  <table>
    <thead><tr><th>Project</th><th>Stage</th><th style="text-align:right">Value</th><th style="text-align:right">Updated</th></tr></thead>
    <tbody>
      <tr><td class="strong">Maple Street retrofit</td>
        <td><span class="pill" style="background:var(--status-success-bg,#E2EEF0);color:var(--status-success-text,#20585F)"><span class="dot" style="background:var(--green-600,#2F767E)"></span>Approved</span></td>
        <td class="num">48,250.00</td><td class="num">2 hrs ago</td></tr>
      <tr><td class="strong">Harbour Point array</td>
        <td><span class="pill" style="background:var(--status-info-bg,#ECF5F6);color:var(--status-info-text,#2E939E)"><span class="dot" style="background:var(--sand-400,#39B8C6)"></span>In review</span></td>
        <td class="num">126,400.00</td><td class="num">Yesterday</td></tr>
      <tr><td class="strong">Fenwick duplex</td>
        <td><span class="pill" style="background:var(--status-warning-bg,#F8F1E6);color:var(--status-warning-text,#7A5C30)"><span class="dot" style="background:var(--yellow-600,#C29C66)"></span>Pending</span></td>
        <td class="num">19,980.00</td><td class="num">3 days ago</td></tr>
      <tr><td class="strong">Alder Court reroof</td>
        <td><span class="pill" style="background:var(--status-danger-bg,#E9F5F7);color:var(--status-danger-text,#3B8188)"><span class="dot" style="background:var(--red-600,#53AAB4)"></span>Overdue</span></td>
        <td class="num">7,310.00</td><td class="num">2 weeks ago</td></tr>
    </tbody>
  </table>
</div>
