<!doctype html>
<meta charset="utf-8">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0}
  body{padding:16px;background:var(--surface-page,#0B0F0F);
    font:400 16px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
  /* The cover is always the dark home theme: night-950 ground, blueprint grid in sand, as the README's motif 1 */
  .cover{position:relative;overflow:hidden;background:var(--night-950,#0B0F0F);
    border:1px solid var(--night-750,#1A2E2F);border-radius:var(--radius-panel,20px);
    padding:40px 32px;min-height:400px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
  .layer{position:absolute;inset:0;pointer-events:none}
  .g1{background-image:linear-gradient(rgba(217,185,138,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(217,185,138,.05) 1px,transparent 1px);background-size:24px 24px}
  .g2{background-image:linear-gradient(rgba(217,185,138,.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(217,185,138,.12) 1px,transparent 1px);background-size:120px 120px}
  .g3{background:radial-gradient(520px 300px at 78% 40%,rgba(26,65,70,.55),transparent 70%)}
  .g4{background:radial-gradient(320px 200px at 4% 96%,rgba(217,185,138,.10),transparent 70%)}
  .in{position:relative;display:flex;flex-direction:column;gap:20px}
  .eyebrow{align-self:flex-start;display:inline-flex;align-items:center;padding:8px 12px;
    border:1px solid rgba(217,185,138,.45);border-radius:999px;background:var(--sand-900,#3A2D18);
    font:500 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.16em;
    text-transform:uppercase;color:var(--sand-300,#E5CDA9);white-space:nowrap}
  .cover h1{margin:0;font:600 56px/0.95 var(--font-display,"Fraunces",Georgia,serif);
    letter-spacing:-.02em;color:var(--teal-050,#EAF3F1);max-width:14ch}
  .lede{display:flex;align-items:flex-start;gap:12px;max-width:52ch}
  .rule{width:48px;height:4px;background:var(--sand-400,#D9B98A);flex:0 0 auto;margin-top:8px}
  .lede p{margin:0;font:400 15px/1.5 var(--font-sans,"Inter",system-ui,sans-serif);color:var(--teal-200,#B5CBC7)}
  .foot{position:relative;display:flex;align-items:flex-end;justify-content:space-between;
    gap:24px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--night-750,#1A2E2F)}
  .foot img{height:24px;width:auto;display:block}
  .sw{display:flex;border-radius:var(--radius-xs,4px);overflow:hidden;border:1px solid var(--night-750,#1A2E2F)}
  .sw span{width:36px;height:24px;display:block}
  .meta{display:flex;gap:24px;flex-wrap:wrap;
    font:500 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.16em;
    text-transform:uppercase;color:var(--teal-300,#93AFAA)}
</style>
<div class="cover">
  <div class="layer g1"></div><div class="layer g2"></div>
  <div class="layer g3"></div><div class="layer g4"></div>
  <div class="in">
    <span class="eyebrow">Design System</span>
    <h1>Internal Design System</h1>
    <div class="lede"><span class="rule"></span>
      <p>Fraunces and Inter, sand on near-black and dark teal, a 4px grid and eighteen components: SubHub's shared language for the tools we use inside the company.</p></div>
  </div>
  <div class="foot">
    <img src="../../assets/logo-light.svg" alt="SubHub">
    <div class="sw">
      <span style="background:var(--sand-400,#D9B98A)"></span>
      <span style="background:var(--night-850,#091D1E)"></span>
      <span style="background:var(--teal-300,#93AFAA)"></span>
      <span style="background:var(--teal-050,#EAF3F1)"></span>
      <span style="background:var(--night-950,#0B0F0F)"></span>
    </div>
    <div class="meta"><span>107 colours</span><span>14 type styles</span><span>4px grid</span><span>18 components</span></div>
  </div>
</div>
