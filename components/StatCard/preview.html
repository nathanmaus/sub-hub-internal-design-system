<!doctype html>
<meta charset="utf-8">
<style>
  :root{
    --weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;
    --tracking-eyebrow:.16em;--tracking-body:-.005em;--tracking-heading:-.02em;--tracking-hero:-.05em;
    --duration-instant:90ms;--duration-fast:150ms;--duration-base:220ms;
    --ease-standard:cubic-bezier(.2,0,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
    --press-scale:.985;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--surface-page,#EAEDEE);
    font:400 16px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:-.005em;
    color:var(--text-body,#5B6769);-webkit-font-smoothing:antialiased}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .col{display:flex;flex-direction:column;gap:12px}
  .cap{font:500 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-subtle,#8F9B9C)}
  .tabular{font-variant-numeric:tabular-nums}
  svg{display:block}
</style>
<style>
  .c{border-radius:var(--radius-card,14px);padding:var(--card-pad,24px);
    box-shadow:var(--shadow-sm,0 1px 2px rgba(14,21,32,.06),0 1px 3px rgba(14,21,32,.05));
    transition:box-shadow var(--duration-base) var(--ease-standard),
      transform var(--duration-base) var(--ease-standard)}
  .c h4{margin:0 0 8px;font:600 19px/1.25 var(--font-sans,"Inter",system-ui,sans-serif)}
  .c p{margin:0;font:400 15px/1.45 var(--font-sans,"Inter",system-ui,sans-serif)}
  .c-default{background:var(--surface-card,#fff);border:1px solid var(--border-subtle,#DBE1E2);
    color:var(--text-body,#5B6769)}
  .c-default h4{color:var(--text-strong,#30393A)}
  .c-sunken{background:var(--surface-sunken,#F8F9F9);border:1px solid var(--border-subtle,#DBE1E2);
    color:var(--text-body,#5B6769)}
  .c-sunken h4{color:var(--text-strong,#30393A)}
  .c-inverse{background:var(--surface-inverse,#1B2122);border:1px solid rgba(255,255,255,.12);
    color:var(--teal-200,#DBE1E2)}
  .c-inverse h4{color:var(--white,#fff)}
  .c-brand{background:var(--surface-brand-subtle,#ECF5F6);border:1px solid var(--sand-200,#D0DFE1);
    color:var(--sand-800,#226E77)}
  .c-brand h4{color:var(--sand-800,#226E77)}
  .c-int:hover{box-shadow:var(--shadow-md,0 2px 4px rgba(14,21,32,.05),0 8px 20px rgba(14,21,32,.07));
    transform:translateY(-2px);cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
</style>

<style>
  .sc{display:grid;gap:12px;padding:20px}
  .sc-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .sc-lbl{font:600 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-subtle,#8F9B9C)}
  .sc-val{font:700 30px/1.1 var(--font-mono,"Inter",system-ui,sans-serif);
    color:var(--text-strong,#30393A);font-variant-numeric:tabular-nums}
  .sc-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .delta{display:inline-flex;align-items:center;gap:4px;
    font:600 13px/1.3 var(--font-sans,"Inter",system-ui,sans-serif)}
  .up{color:var(--green-700,#20585F)}.down{color:var(--red-700,#3B8188)}
  .foot{font:400 13px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);color:var(--text-muted,#707A7B)}
</style>
<div class="grid">
  <div class="c c-default sc">
    <div class="sc-top"><span class="sc-lbl">Pipeline</span><span aria-hidden="true" style="display:inline-block;flex:0 0 auto;width:17px;height:17px;background:var(--text-subtle,#8F9B9C);-webkit-mask:url(../../icons/card.svg) center/contain no-repeat;mask:url(../../icons/card.svg) center/contain no-repeat"></span></div>
    <div class="sc-row"><span class="sc-val">$482,100</span>
      <span class="delta up"><span aria-hidden="true" style="display:inline-block;flex:0 0 auto;width:14px;height:14px;background:currentColor;-webkit-mask:url(../../icons/trend-up.svg) center/contain no-repeat;mask:url(../../icons/trend-up.svg) center/contain no-repeat"></span> 12.4%</span></div>
    <span class="foot">Across 38 open quotes</span>
  </div>
  <div class="c c-default sc">
    <div class="sc-top"><span class="sc-lbl">Close rate</span><span aria-hidden="true" style="display:inline-block;flex:0 0 auto;width:17px;height:17px;background:var(--text-subtle,#8F9B9C);-webkit-mask:url(../../icons/lightning-bolt.svg) center/contain no-repeat;mask:url(../../icons/lightning-bolt.svg) center/contain no-repeat"></span></div>
    <div class="sc-row"><span class="sc-val">31.8%</span>
      <span class="delta down"><span aria-hidden="true" style="display:inline-block;flex:0 0 auto;width:14px;height:14px;background:currentColor;-webkit-mask:url(../../icons/trend-down.svg) center/contain no-repeat;mask:url(../../icons/trend-down.svg) center/contain no-repeat"></span> 2.1%</span></div>
    <span class="foot">Rolling 90 days</span>
  </div>
  <div class="c c-default sc">
    <div class="sc-top"><span class="sc-lbl">Jobs booked</span><span aria-hidden="true" style="display:inline-block;flex:0 0 auto;width:17px;height:17px;background:var(--text-subtle,#8F9B9C);-webkit-mask:url(../../icons/calendar.svg) center/contain no-repeat;mask:url(../../icons/calendar.svg) center/contain no-repeat"></span></div>
    <div class="sc-row"><span class="sc-val">124</span></div>
    <span class="foot">This quarter</span>
  </div>
</div>
