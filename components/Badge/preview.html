<!doctype html>
<meta charset="utf-8">
<style>
  :root{
    --weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;
    --tracking-eyebrow:.16em;--tracking-body:-.005em;--tracking-heading:-.02em;--tracking-hero:-.05em;
    --duration-instant:90ms;--duration-fast:150ms;--duration-base:220ms;
    --ease-standard:cubic-bezier(.2,0,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
    --press-scale:.985;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--surface-page,#EAEDEE);
    font:400 16px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:-.005em;
    color:var(--text-body,#5B6769);-webkit-font-smoothing:antialiased}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .col{display:flex;flex-direction:column;gap:12px}
  .cap{font:500 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-subtle,#8F9B9C)}
  .tabular{font-variant-numeric:tabular-nums}
  svg{display:block}
</style>
<style>
  .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;
    border-radius:var(--radius-pill,999px);white-space:nowrap;border:1px solid transparent;
    font:600 13px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:-.005em}
  .badge.up{font:500 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);
    letter-spacing:.16em;text-transform:uppercase}
  .neutral{background:var(--teal-100,#EAEDEE);color:var(--teal-700,#5B6769);border-color:var(--teal-200,#DBE1E2)}
  .brand{background:var(--sand-100,#ECF5F6);color:var(--sand-700,#2E939E);border-color:var(--sand-200,#D0DFE1)}
  .accent{background:var(--surface-accent-subtle,#F8F1E6);color:var(--sand-700,#7A5C30)}
  .ai{background:var(--surface-ai-subtle,#F8F1E6);color:var(--sand-700,#7A5C30)}
  .aidark{background:rgba(217,185,138,.08);color:var(--sand-400,#D9B98A);border-color:rgba(217,185,138,.45)}
  .inverse{background:rgba(255,255,255,.12);color:var(--white,#fff)}
</style>
<div class="col" style="gap:16px">
  <div class="row">
    <span class="badge neutral">Neutral</span>
    <span class="badge brand">Brand</span>
    <span class="badge accent">Accent</span>
    <span class="badge ai"><span aria-hidden="true" style="display:inline-block;flex:0 0 auto;width:13px;height:13px;background:currentColor;-webkit-mask:url(../../icons/lightning-bolt.svg) center/contain no-repeat;mask:url(../../icons/lightning-bolt.svg) center/contain no-repeat"></span> AI drafted</span>
    <span class="badge up brand">Uppercase</span>
  </div>
  <div class="row" style="background:var(--surface-inverse,#1B2122);padding:16px;
    border-radius:var(--radius-card,14px)">
    <span class="badge aidark"><span aria-hidden="true" style="display:inline-block;flex:0 0 auto;width:13px;height:13px;background:currentColor;-webkit-mask:url(../../icons/lightning-bolt.svg) center/contain no-repeat;mask:url(../../icons/lightning-bolt.svg) center/contain no-repeat"></span> AI drafted</span>
    <span class="badge inverse">On ink</span>
  </div>
</div>
