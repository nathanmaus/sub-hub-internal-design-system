<!doctype html>
<meta charset="utf-8">
<style>
  :root{
    --weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;
    --tracking-eyebrow:.16em;--tracking-body:-.005em;--tracking-heading:-.02em;--tracking-hero:-.05em;
    --duration-instant:90ms;--duration-fast:150ms;--duration-base:220ms;
    --ease-standard:cubic-bezier(.2,0,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
    --press-scale:.985;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--surface-page,#EAEDEE);
    font:400 16px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:-.005em;
    color:var(--text-body,#5B6769);-webkit-font-smoothing:antialiased}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .col{display:flex;flex-direction:column;gap:12px}
  .cap{font:500 12px/1 var(--font-sans,"Inter",system-ui,sans-serif);letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-subtle,#8F9B9C)}
  .tabular{font-variant-numeric:tabular-nums}
  svg{display:block}
</style>
<style>
  .sw{display:inline-flex;align-items:center;gap:12px}
  .track{width:44px;height:24px;border-radius:var(--radius-pill,999px);padding:4px;flex:0 0 auto;
    display:flex;background:var(--teal-300,#C6CECE);
    transition:background-color var(--duration-base) var(--ease-standard)}
  .track.on{background:var(--action-primary,#39B8C6);justify-content:flex-end}
  .thumb{width:16px;height:16px;border-radius:50%;background:var(--white,#fff);
    box-shadow:var(--shadow-xs,0 1px 2px rgba(14,21,32,.06))}
  .swl{font:400 15px/1.45 var(--font-sans,"Inter",system-ui,sans-serif);color:var(--text-strong,#30393A)}
</style>
<div class="col" style="gap:16px">
  <span class="sw"><span class="track on" role="switch" aria-checked="true"><span class="thumb"></span></span>
    <span class="swl">Email the homeowner on approval</span></span>
  <span class="sw"><span class="track" role="switch" aria-checked="false"><span class="thumb"></span></span>
    <span class="swl">Include materials breakdown</span></span>
  <span class="sw" style="opacity:.55"><span class="track" role="switch" aria-checked="false"><span class="thumb"></span></span>
    <span class="swl">Auto-invoice on completion</span></span>
</div>
