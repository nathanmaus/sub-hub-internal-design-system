<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internal Design System</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--surface-page);color:var(--text-body);font:400 16px/1.5 var(--font-sans)}
  main{max-width:960px;margin:0 auto;padding:32px 16px 64px;display:grid;gap:24px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{margin:0;font:700 28px/1.2 var(--font-display);color:var(--text-strong)}
  h2{margin:0 0 16px;font:600 20px/1.3 var(--font-sans);color:var(--text-strong)}
  p{margin:0}
  section{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:24px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .icon{display:grid;justify-items:center;gap:8px;padding:12px 4px;border-radius:var(--radius-control);color:var(--text-strong);text-align:center}
  .icon span:last-child{font:400 12px/1.3 var(--font-sans);color:var(--text-muted);word-break:break-word}
  .muted{color:var(--text-muted)}
  code{font-size:14px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="components/bundle.js"></script>
<script>
(function () {
  var DS = window.InternalDesignSystem;
  var e = React.createElement;

  function App() {
    var s = React.useState(document.documentElement.dataset.theme || "light");
    var theme = s[0], setTheme = s[1];
    var q = React.useState([]); var icons = q[0], setIcons = q[1];
    React.useEffect(function () { document.documentElement.dataset.theme = theme; }, [theme]);
    React.useEffect(function () {
      fetch("icons/index.json").then(function (r) { return r.json(); })
        .then(function (d) { setIcons(d.icons); }).catch(function () {});
    }, []);
    return e("main", null,
      e("header", null,
        e("div", null,
          e("h1", null, "Internal Design System"),
          e("p", { className: "muted" }, "Live components from this repo. Source of truth for tokens, components and icons.")),
        e(DS.Button, { variant: "secondary", icon: theme === "light" ? "moon" : "sun",
          onClick: function () { setTheme(theme === "light" ? "dark" : "light"); } },
          theme === "light" ? "Dark mode" : "Light mode")),
      e("section", null, e("h2", null, "Buttons"),
        e("div", { className: "row" },
          e(DS.Button, { variant: "primary", icon: "plus" }, "Create quote"),
          e(DS.Button, { variant: "secondary" }, "Save draft"),
          e(DS.Button, { variant: "dark" }, "Open job"),
          e(DS.Button, { variant: "accent", icon: "sparkle" }, "Ask AI"),
          e(DS.Button, { variant: "ghost" }, "Cancel"),
          e(DS.IconButton, { icon: "plus", variant: "solid", label: "Add" }),
          e(DS.IconButton, { icon: "pencil", variant: "outline", label: "Edit" }))),
      e("section", null, e("h2", null, "Status"),
        e("div", { className: "row" },
          ["approved", "pending", "overdue", "review", "draft"].map(function (st) {
            return e(DS.StatusPill, { key: st, state: st }, st.charAt(0).toUpperCase() + st.slice(1));
          }))),
      e("section", null, e("h2", null, "Icons (" + icons.length + ")"),
        e("div", { className: "icons" }, icons.map(function (n) {
          return e("div", { className: "icon", key: n }, e(DS.Icon, { name: n, size: 24 }), e("span", null, n));
        })))
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(e(App));
})();
</script>
</body>
</html>
